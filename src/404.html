
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>404 - Page Not Found | VASHQ</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #1769ff;
            --dark-blue: #0b3d91;
            --light-blue: #eaf2ff;
            --text: #172033;
            --muted: #718096;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #ffffff;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BACKGROUND */

        .v404-page {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            isolation: isolate;
        }

        .v404-bg-glow {
            position: absolute;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(23, 105, 255, 0.10),
                rgba(23, 105, 255, 0.025) 50%,
                transparent 72%
            );
            z-index: -1;
            pointer-events: none;
            animation: v404-glow 9s ease-in-out infinite alternate;
        }

        .v404-bg-glow.one {
            top: -300px;
            left: -200px;
        }

        .v404-bg-glow.two {
            bottom: -350px;
            right: -200px;
            animation-delay: -4s;
        }

        @keyframes v404-glow {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(40px, 30px) scale(1.15);
            }
        }

        /* BACKGROUND DOTS */

        .v404-dots {
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0.35;
            background-image: radial-gradient(#1769ff 0.8px, transparent 0.8px);
            background-size: 35px 35px;
            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );
            pointer-events: none;
        }

        /* NAVBAR */

        .v404-navbar {
            width: 100%;
            max-width: 1300px;
            margin: auto;
            padding: 30px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .v404-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        .v404-nav-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #8290a5;
            text-transform: uppercase;
        }

        /* MAIN CONTENT */

        .v404-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 65px;
            text-align: center;
        }

        .v404-content {
            width: 100%;
            max-width: 850px;
            animation: v404-enter 1s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes v404-enter {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ERROR BADGE */

        .v404-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 17px;
            background: #eff5ff;
            border: 1px solid #dce9ff;
            border-radius: 50px;
            color: var(--blue);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
            animation: v404-badge 3s ease-in-out infinite;
        }

        .v404-badge-dot {
            width: 7px;
            height: 7px;
            background: var(--blue);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(23,105,255,0.12);
        }

        @keyframes v404-badge {
            50% {
                box-shadow: 0 5px 25px rgba(23,105,255,0.12);
            }
        }

        /* 404 NUMBER */

        .v404-number {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(90px, 17vw, 175px);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -12px;
            background: linear-gradient(
                135deg,
                #0b3d91 5%,
                #1769ff 45%,
                #75a8ff 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 12px 15px rgba(23,105,255,0.10));
            animation: v404-number 4s ease-in-out infinite;
        }

        @keyframes v404-number {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-9px);
            }
        }

        /* IMAGE AREA */

        .v404-image-area {
            width: 100%;
            max-width: 390px;
            height: 230px;
            margin: 8px auto 22px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .v404-image-circle {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                #e8f1ff 0%,
                rgba(232,241,255,0.4) 55%,
                transparent 75%
            );
        }

        .v404-image-circle::before,
        .v404-image-circle::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(23,105,255,0.12);
            border-radius: 50%;
            inset: -18px;
            animation: v404-ring 5s linear infinite;
        }

        .v404-image-circle::after {
            inset: -38px;
            animation-delay: -2.5s;
        }

        @keyframes v404-ring {
            0% {
                transform: scale(0.94);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.06);
                opacity: 0.8;
            }
            100% {
                transform: scale(0.94);
                opacity: 0.3;
            }
        }

        /* ADD YOUR PNG IMAGE HERE */

        .v404-image {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: v404-float 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 20px rgba(23,105,255,0.10));
        }

        @keyframes v404-float {
            0%, 100% {
                transform: translateY(0) rotate(-1deg);
            }
            50% {
                transform: translateY(-12px) rotate(1deg);
            }
        }

        /* TEXT */

        .v404-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(27px, 4vw, 40px);
            font-weight: 700;
            letter-spacing: -1.2px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .v404-description {
            max-width: 480px;
            margin: 0 auto;
            font-size: 15px;
            line-height: 1.9;
            color: var(--muted);
        }

        .v404-description span {
            color: var(--blue);
            font-weight: 700;
        }

        /* BUTTONS */

        .v404-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .v404-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.35s ease;
        }

        .v404-btn-primary {
            background: linear-gradient(135deg, #1769ff, #0b3d91);
            color: #fff;
            box-shadow: 0 10px 25px rgba(23,105,255,0.22);
        }

        .v404-btn-primary:hover {
            color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(23,105,255,0.35);
        }

        .v404-btn-secondary {
            color: #1769ff;
            border: 1px solid #dce8ff;
            background: #fff;
        }

        .v404-btn-secondary:hover {
            background: #eff5ff;
            border-color: #1769ff;
            transform: translateY(-5px);
        }

        .v404-btn i {
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .v404-btn-primary:hover i {
            transform: translateX(4px);
        }

        /* FOOTER */

        .v404-footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(23,105,255,0.08);
        }

        .v404-footer p {
            color: #9aa6b8;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .v404-footer span {
            color: var(--blue);
            font-weight: 700;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            .v404-navbar {
                padding: 22px 20px;
            }

            .v404-logo {
                height: 30px;
            }

            .v404-nav-label {
                font-size: 9px;
                letter-spacing: 1px;
            }

            .v404-main {
                padding: 20px 18px 45px;
            }

            .v404-number {
                letter-spacing: -6px;
            }

            .v404-image-area {
                height: 190px;
                max-width: 300px;
            }

            .v404-image-circle {
                width: 175px;
                height: 175px;
            }

            .v404-title {
                font-size: 28px;
            }

            .v404-description {
                font-size: 13px;
            }

            .v404-actions {
                gap: 10px;
            }

            .v404-btn {
                padding: 14px 20px;
                font-size: 12px;
            }
        }

        /* ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

<body>

<div class="v404-page">

    <div class="v404-bg-glow one"></div>
    <div class="v404-bg-glow two"></div>
    <div class="v404-dots"></div>

    <!-- NAVBAR -->

    <header class="v404-navbar">
            <img
                src="./assets/images/brand/logo-full.webp"
                alt="VASHQ Logo"
                class="v404-logo"
            >



    </header>


    <!-- MAIN CONTENT -->

    <main class="v404-main">

        <div class="v404-content">

            <h1 class="v404-number">404</h1>


            <!-- =================================
                 PNG IMAGE SPACE
                 
                 Replace YOUR-IMAGE.png with
                 your actual PNG image path.
            ================================== -->

            <div class="v404-image-area">

                <img
                    src="./assets/images/blue_octopus.png"
                    alt="Page Not Found Illustration"
                    class="v404-image"
                >

            </div>


            <h2 class="v404-title">
                Oops! Lost Your Way?
            </h2>

            <p class="v404-description">
                Looks like this page has taken a little detour.
                Don't worry, let's get you back
                <span>on the right track.</span>
            </p>


            <!-- BUTTONS -->

            <div class="v404-actions">

                <a href="./" class="v404-btn v404-btn-primary">
                    <i class="bi bi-house-door"></i>
                    Back to Home
                    <i class="bi bi-arrow-right"></i>
                </a>

                <a href="javascript:history.back()" class="v404-btn v404-btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Go Back
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="v404-footer">

        <p>
            © 2026 <span>VASHQ</span>.
            All rights reserved.
            Built for better business.
        </p>

    </footer>

</div>

</body>
</html>
